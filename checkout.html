<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Haldia Food Express</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>

  <script>

      apiKey: "AIzaSyDLjAPGx9s1iiY9EGSd5len115dRQbQCYw",
      authDomain: "food-delivery-app-24517.firebaseapp.com",
      projectId: "food-delivery-app-24517",
      storageBucket: "food-delivery-app-24517.firebasestorage.app",
      messagingSenderId: "869509993841",
      appId: "1:869509993841:web:d968d5491ca1719ec2d2d0",
      measurementId: "G-3TG883F50G"
    };

    firebase.initializeApp(firebaseConfig);
    const analytics = firebase.analytics();

    messaging.onMessage((payload) => {
      console.log('Message received in foreground:', payload);
      if (payload.notification) {
        alert("Notification: " + payload.notification.title + "\n" + payload.notification.body);

    });</script>

<body class="bg-slate-50 min-h-screen pb-12 font-sans text-slate-800">

  <div class="max-w-md mx-auto pt-4 px-4">
    <header class="flex items-center justify-between py-3 mb-4 bg-white px-5 rounded-3xl shadow-sm border border-slate-200/60">
      <button onclick="history.back()" class="w-10 h-10 flex items-center justify-center rounded-2xl border border-slate-200 text-slate-700 hover:bg-slate-50 cursor-pointer">
        <i class="fa-solid fa-arrow-left text-sm"></i>
      </button>
      <h1 class="text-base font-bold text-slate-900 tracking-tight">Checkout</h1>
      <div class="w-10"></div>
    </header>

    <div class="bg-white rounded-3xl p-6 mb-6 shadow-sm border border-slate-200/60 space-y-4">
      <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-400">REVIEW ORDER</h3>
      <div id="checkoutItemsList" class="divide-y divide-slate-100"></div>
      <div id="emptyCartMsg" class="text-center py-6 hidden">
        <i class="fa-solid fa-cart-shopping text-3xl text-slate-300 mb-2"></i>
        <p class="text-sm font-semibold text-slate-500">Your cart is empty.</p>
        <a href="index.html" class="text-xs text-emerald-600 font-bold mt-1 inline-block">Add items from menu →</a>
      </div>
      <div class="pt-4 border-t border-slate-100 flex justify-between items-center text-sm">
        <span class="text-slate-500 font-medium">Total Amount</span>
        <span class="text-xl font-bold text-rose-600">₹<span id="checkoutTotalAmount">0.00</span></span>
      </div>
    </div>

    <form id="checkoutForm" onsubmit="processOrder(event)" class="bg-white rounded-3xl p-6 mb-6 shadow-sm border border-slate-200/60 space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wider">Payment Method</label>
        <div class="w-full p-3.5 border border-emerald-500 rounded-2xl bg-emerald-50/50 text-emerald-900 font-bold text-sm flex items-center justify-between">
          <span>Cash On Delivery (COD)</span>
          <i class="fa-solid fa-money-bill-wave text-emerald-600"></i>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wider" for="deliveryAddress">Delivery Address</label>
        <textarea id="deliveryAddress" required rows="2" placeholder="Enter your delivery address" class="w-full border border-slate-200 rounded-2xl p-3.5 text-xs bg-slate-50 font-medium focus:ring-2 focus:ring-rose-500/20 focus:border-rose-500 outline-none transition"></textarea>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wider" for="phoneNumber">Phone Number</label>
        <input type="tel" id="phoneNumber" required pattern="[0-9]{10}" placeholder="10-digit mobile number" class="w-full border border-slate-200 rounded-2xl p-3.5 text-xs bg-slate-50 font-medium focus:ring-2 focus:ring-rose-500/20 focus:border-rose-500 outline-none transition">
      </div>

      <button type="submit" id="placeOrderBtn"class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-black text-sm rounded-2xl shadow-lg shadow-emerald-200 transition flex items-center justify-center gap-2 cursor-pointer mt-2">
        <i class="fa-solid fa-truck text-xs"></i> Place Order
      </button>
    </form>
  </div>

  <script>
    let cart = {};
    const menuItems = [
      { id: 'puri_sabzi', name: 'Puri Sabzi', price: 50, category: 'snacks' },
      { id: 'roti', name: 'Roti (1 Pic)', price: 7, category: 'roti' },
      { id: 'roti_sabzi', name: 'Roti Sabzi', price: 80, category: 'roti' },
      { id: 'roti_tadka', name: 'Roti Tadka', price: 100, category: 'roti' },
      { id: 'fish_thali', name: 'Fish Thali', price: 140, category: 'thali' },
      { id: 'egg_thali', name: 'Egg Thali', price: 120, category: 'thali' },
      { id: 'chick_thali', name: 'Chicken Thali', price: 160, category: 'thali' },
      { id: 'veg_thali', name: 'Veg Thali', price: 100, category: 'thali' },
      { id: 'tadka_rot', name: 'Tadka Roti Twist Combo', price: 110, category: 'thali' },
      { id: 'dal_tadka', name: 'Dal Tadka', price: 90, category: 'thali' },
      { id: 'aloo_dum', name: 'Aloo Dum', price: 70, category: 'thali' },
      { id: 'chole_bhat', name: 'Chole Bhature', price: 90, category: 'thali' },
      { id: 'egg_roll', name: 'Egg Roll', price: 35, category: 'snacks' },
      { id: 'chick_roll', name: 'Chicken Roll', price: 65, category: 'snacks' },
      { id: 'veg_chop', name: 'Veg Chop', price: 10, category: 'snacks' },
      { id: 'alo_chop', name: 'Aloo Chop', price: 10, category: 'snacks' },
      { id: 'beguni', name: 'Beguni', price: 10, category: 'snacks' },
      { id: 'peyaji', name: 'Peyaji', price: 10, category: 'snacks' },
      { id: 'fuluri', name: 'Fuluri', price: 10, category: 'snacks' },
      { id: 'egg_chaw', name: 'Egg Chawmin', price: 50, category: 'chowmein' },
      { id: 'chick_chaw', name: 'Chicken Chowmein', price: 90, category: 'chowmein' },
      { id: 'veg_chaw', name: 'Veg Chowmein', price: 60, category: 'chowmein' },
      { id: 'mix_chaw', name: 'Mix Chowmein', price: 110, category: 'chowmein' },
      { id: 'campa', name: 'Campa', price: 35, category: 'drinks' },
      { id: 'sprite', name: 'Sprite', price: 20, category: 'drinks' },
      { id: 'fanta', name: 'Fanta', price: 20, category: 'drinks' },
      { id: 'thumbs_up', name: 'Thumbs Up', price: 20, category: 'drinks' },
      { id: 'maaza', name: 'Maaza', price: 20, category: 'drinks' }
    ];

    const menuItemMap = {};
    menuItems.forEach(item => { menuItemMap[item.id] = item; });

    window.onload = function() {
      const savedCart = localStorage.getItem('cartData');
      if (savedCart) {
        try { cart = JSON.parse(savedCart); } catch (e) { console.error(e); cart = {}; }
      }

      const savedAddress = localStorage.getItem('deliveryAddress');
      if (savedAddress) document.getElementById('deliveryAddress').value = savedAddress;

      const savedPhone = localStorage.getItem('deliveryPhone');
      if (savedPhone) document.getElementById('phoneNumber').value = savedPhone;

      renderCheckoutList();
    };

    document.getElementById('deliveryAddress').addEventListener('input', function() {
      localStorage.setItem('deliveryAddress', this.value);
    });

    document.getElementById('phoneNumber').addEventListener('input', function() {
      localStorage.setItem('deliveryPhone', this.value);
    });

    function renderCheckoutList() {
      const listContainer = document.getElementById('checkoutItemsList');
      const emptyMsg = document.getElementById('emptyCartMsg');
      listContainer.innerHTML = '';

      let total = 0;
      let count = 0;

      for (const id in cart) {
        if (cart[id].qty > 0) {
          count += cart[id].qty;
          const itemTotal = cart[id].price * cart[id].qty;
          total += itemTotal;

          listContainer.innerHTML += `
            <div class="py-3 flex justify-between items-center text-xs">
              <div>
                <h4 class="font-bold text-slate-800">${cart[id].name}</h4>
                <span class="text-slate-400 text-[11px]">₹${cart[id].price} x ${cart[id].qty}</span>
              </div>
              <div class="flex items-center gap-3">
                <span class="font-bold text-slate-900">₹${itemTotal.toFixed(2)}</span>
                <button onclick="removeItem('${id}')" class="text-rose-400 hover:text-rose-600 p-1">
                  <i class="fa-solid fa-trash-can"></i>
                </button>
              </div>
            </div>
          `;
        }
      }

      if (count === 0) {
        emptyMsg.classList.remove('hidden');
        document.getElementById('placeOrderBtn').disabled = true;
        document.getElementById('placeOrderBtn').className = "w-full py-4 bg-slate-200 text-slate-400 font-bold rounded-2xl cursor-not-allowed mt-2 text-sm";
      } else {
        emptyMsg.classList.add('hidden');
        document.getElementById('placeOrderBtn').disabled = false;
      }

      document.getElementById('checkoutTotalAmount').innerText = total.toFixed(2);
    }

    function removeItem(id) {
      delete cart[id];
      localStorage.setItem('cartData', JSON.stringify(cart));
      renderCheckoutList();
    }

    function processOrder(event) {
      event.preventDefault();

      let total = 0;
      let itemsArray = [];
      for (const id in cart) {
        if (cart[id].qty > 0) {
          itemsArray.push(cart[id]);
          total += cart[id].price * cart[id].qty;
        }
      }

      const orderData = {
        orderId: 'HFE-' + Math.floor(10000 + Math.random() * 90000),
        items: itemsArray,
        totalAmount: total,
        deliveryAddress: document.getElementById('deliveryAddress').value,
        phone: document.getElementById('phoneNumber').value,
        paymentMethod: 'Cash on Delivery',
        status: 'Confirmed',
        timestamp: new Date().getTime()
      };

      localStorage.setItem('lastPlacedOrder', JSON.stringify(orderData));
      localStorage.removeItem('cartData');
db.collection('orders').add(orderData).then(() => { window.location.href = 'order-confirmation.html?mode=cod'; }) .catch((error) => { console.error("Error adding document: ", error); });

      window.location.href = 'order-confirmation.html?mode=cod';
    }
  </script>
</body>
</html>
